<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none" role="img"><title>Let&#x27;s talk</title><defs><style>@font-face{font-family:JB;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
