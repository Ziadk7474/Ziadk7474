name: Draw activity graph

on:
  schedule:
    - cron: '23 1,13 * * *'   # twice a day (5:23 am and 5:23 pm UAE time)
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths-ignore: ['assets/activity.svg']

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw assets/activity.svg
        run: node scripts/activity.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "Update activity graph"
          git push
